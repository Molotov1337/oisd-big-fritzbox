name: Aktualisiere OISD Big Teillisten

on:
  schedule:
    - cron: '0 2 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v7

      - name: Aktuelle OISD-Liste laden und aufteilen
        run: python3 scripts/split_oisd.py

      - name: Neue Listen veröffentlichen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lists/
          if ! git diff --cached --quiet; then
            git commit -m 'Update OISD Big split lists'
            git push
          else
            echo 'Keine Änderungen an den Listen.'
          fi
